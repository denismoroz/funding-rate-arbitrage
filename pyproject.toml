[project]
name = "funding-rate-arbitrage"
version = "0.1.0"
description = "Funding-rate arbitrage shadow-testing system"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=3.0.3",
    "requests>=2.34.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "aiosqlite>=0.20.0",
    "alembic>=1.14.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    "structlog>=24.4.0",
    "typer>=0.15.0",
]

[project.scripts]
frab = "frab.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=6.0.0",
    "respx>=0.22.0",
    "freezegun>=1.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/frab"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["src"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.coverage.run]
source = ["src/frab"]
branch = true
omit = [
    "src/frab/db/migrations/*",
    "src/frab/**/test_*.py",
    "src/frab/**/conftest.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
